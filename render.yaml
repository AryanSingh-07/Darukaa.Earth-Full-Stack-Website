services:
  - type: web
    name: darukaa-earth
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: true

databases:
  - name: darukaa-db
    plan: free
    databaseName: darukaa
    user: darukaa
